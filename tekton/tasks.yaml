---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3.19
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone-local
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:2.45.2
      script: |
        #!/bin/sh
        set -eu
        git clone --depth 1 --branch "$(params.revision)" \
          "$(params.url)" "$(workspaces.output.path)/source"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8-local
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/source
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir flake8==4.0.1
        flake8 service --count --max-complexity=10 --max-line-length=127 --statistics

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test-local
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)/source
      env:
        - name: DATABASE_URI
          value: postgresql://postgres:postgres@postgresql:5432/postgres
        - name: SECRET_KEY
          value: tekton-test-secret
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -r requirements.txt
        nosetests -v
